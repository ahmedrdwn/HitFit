*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#060608;--bg2:#0c0c10;--bg3:#131318;--bg4:#1a1a22;--fg:#fff;--fg2:rgba(255,255,255,.7);--fg3:rgba(255,255,255,.4);--fg4:rgba(255,255,255,.12);--accent:#ff5733;--accent2:#ff8c42;--teal:#2dd4a8;--gold:#fbbf24;--violet:#a78bfa;--red:#ef4444;--r:14px;--rs:10px}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:'DM Sans',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:0;height:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp .5s ease both}
.fd1{animation-delay:.05s}.fd2{animation-delay:.1s}.fd3{animation-delay:.15s}.fd4{animation-delay:.2s}.fd5{animation-delay:.25s}

.login-box{max-width:400px;width:100%;text-align:center}
.login-logo{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;margin:0 auto 28px;font-family:'Bebas Neue',sans-serif;font-size:42px;color:#000;box-shadow:0 20px 60px rgba(255,87,51,.25)}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:3px;margin-bottom:4px}
.login-sub{color:var(--fg3);font-size:14px;margin-bottom:36px}
.login-card{background:var(--bg2);border:1px solid var(--fg4);border-radius:20px;padding:28px}
.g-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#333;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:transform .15s,box-shadow .3s}

.g-btn:active{transform:scale(.98)}
.g-btn svg{width:20px;height:20px}
.login-loading{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px}
.spinner{width:32px;height:32px;border:3px solid var(--fg4);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}

.shell{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.04);background:rgba(6,6,8,.85);backdrop-filter:blur(20px);position:sticky;top:0;z-index:50}
.topbar-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:14px;color:#000;margin-right:8px;flex-shrink:0}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px}
.topbar-user{margin-left:auto;display:flex;align-items:center;gap:8px}
.topbar-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid var(--fg4)}
.topbar-name{color:var(--fg3);font-size:11px;font-weight:600;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-logout{background:var(--bg3);color:var(--fg3);border:none;border-radius:7px;padding:4px 10px;font-size:10px;cursor:pointer;font-family:'DM Sans',sans-serif}
.sync-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

.nav{display:flex;gap:2px;padding:8px 16px;background:var(--bg);position:sticky;top:53px;z-index:40}
.nav-btn{flex:1;padding:9px 4px;border:none;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;position:relative}
.nav-btn.active{background:var(--bg3);color:var(--fg)}
.nav-btn:not(.active){background:transparent;color:var(--fg3)}
.nav-btn.active::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:14px;height:2px;background:var(--accent);border-radius:2px}

.week-bar{display:flex;gap:2px;padding:4px 16px;overflow-x:auto;scrollbar-width:none}
.wk{min-width:36px;padding:6px 0;border:none;border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;cursor:pointer;transition:all .2s;flex-shrink:0}
.wk.on{background:linear-gradient(135deg,var(--accent),#e8431f);color:#fff}
.wk:not(.on){background:var(--bg3);color:var(--fg3)}
.wk.b2:not(.on){background:rgba(167,139,250,.08);color:rgba(167,139,250,.5)}
.wk.b2.on{background:linear-gradient(135deg,var(--violet),#6366f1)}

.blk-l{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.dl-tag{background:rgba(251,191,36,.1);color:var(--gold);font-size:8px;padding:2px 9px;border-radius:20px;font-weight:700}

.dtabs{display:flex;gap:3px;padding:4px 16px}
.dtab{flex:1;padding:9px 2px;border-radius:10px;font-size:10.5px;font-weight:600;cursor:pointer;transition:all .2s;border:1px solid transparent;font-family:'DM Sans',sans-serif;text-align:center}
.pbar{padding:5px 16px}
.pbar-h{display:flex;justify-content:space-between;margin-bottom:3px}
.pbar-h span{font-size:9px;font-family:'JetBrains Mono',monospace}
.pbar-t{height:3px;background:var(--bg3);border-radius:20px;overflow:hidden}
.pbar-f{height:100%;border-radius:20px;transition:width .4s}

.trow{display:flex;gap:4px;padding:5px 16px}
.tbtn{flex:1;padding:7px 0;background:var(--bg3);color:var(--fg3);border:1px solid var(--fg4);border-radius:8px;font-size:10.5px;font-family:'JetBrains Mono',monospace;font-weight:600;cursor:pointer;transition:all .15s}
.tbtn:active{transform:scale(.95);background:var(--accent);color:#fff;border-color:var(--accent)}

.exl{padding:4px 16px 120px;display:flex;flex-direction:column;gap:7px}
.exc{background:var(--bg2);border-radius:var(--r);padding:13px 15px;border-left:3px solid var(--accent);transition:all .3s}
.exc.dn{opacity:.35;border-left-color:var(--fg4)}
.exh{display:flex;align-items:center;gap:9px;cursor:pointer}
.chk{width:21px;height:21px;border-radius:6px;border:2px solid var(--accent);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:all .2s}

.exn{color:var(--fg);font-weight:700;font-size:13px}

.exm{display:flex;gap:12px;margin-top:3px}
.exm span{font-size:11px;font-family:'JetBrains Mono',monospace;font-weight:600}

.chev{width:12px;height:12px;flex-shrink:0;transition:transform .3s}

.tov{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;backdrop-filter:blur(30px)}

.dash{padding:16px 16px 100px}

.dash-g{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;margin-bottom:3px}
.dash-s{color:var(--fg3);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}

.stat-v{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px}

.ddn{font-weight:700;font-size:12.5px}
.ddm{color:var(--fg3);font-size:11px;margin-top:1px}

.pc{background:var(--bg2);border:1px solid var(--fg4);border-radius:var(--r);padding:12px;margin-bottom:8px}
.pch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pcn{font-weight:700;font-size:12px}
.pcpr{color:var(--teal);font-size:10.5px;font-family:'JetBrains Mono',monospace;font-weight:700}
.pbs{display:flex;gap:2px;align-items:end;height:40px}
.pb{flex:1;border-radius:3px;min-width:4px}
.pe{text-align:center;padding:50px 20px;background:var(--bg2);border-radius:20px;border:1px dashed var(--fg4)}
.pe p{color:var(--fg3);font-size:12.5px;line-height:1.6}

.ov{padding:16px 16px 100px}
.ovc{background:var(--bg2);border:1px solid var(--fg4);border-radius:14px;padding:14px;margin-bottom:10px}
.ovt{font-weight:700;font-size:13px;margin-bottom:8px}
.ove{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)}

@media(min-width:600px){.shell{max-width:480px;margin:0 auto;border-left:1px solid var(--fg4);border-right:1px solid var(--fg4);min-height:100vh}}
</style>
